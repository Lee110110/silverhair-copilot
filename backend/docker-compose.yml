version: "3.8"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: silverhair
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/silverhair
      SECRET_KEY: change-this-in-production
      SMS_PROVIDER: mock
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: "*"
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: